<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE // Member Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .candle-flame {
            width: 12px;
            height: 20px;
            border-radius: 50% 50% 45% 45%;
            background: radial-gradient(circle at 50% 18%, #fff3c5 0%, #fcd34d 35%, transparent 70%);
            position: relative;
            animation: flicker 1.2s infinite ease-in-out, drift 3.2s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.4);
        }
        .candle-base {
            width: 8px;
            height: 28px;
            background: linear-gradient(180deg, #f7f7f7, #c4b29a);
            border-radius: 4px;
            margin: 0 auto;
        }
        .candle-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--stroke);
            background: var(--surface);
            border-radius: var(--radius-sm);
        }
        .progress-track {
            flex: 1;
            height: 8px;
            border-radius: 999px;
            background: var(--stroke);
            overflow: hidden;
        }
        .progress-fill {
            width: 72%;
            height: 100%;
            border-radius: 999px;
            background: var(--gradient-primary);
            position: relative;
        }
        .progress-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 100px;
        }
        .progress-meta span {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .progress-meta strong {
            font-size: 14px;
            color: var(--text);
            font-weight: 600;
        }
        @keyframes flicker {
            0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-1px) scale(0.96); opacity: 0.88; }
        }
        @keyframes drift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(1px); }
        }
    </style>
</head>
<body class="spectre-body">
    <div class="spectre-content">
        <a href="index.html" class="spectre-btn mb-4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Dashboard</a>

        <div class="ghost-panel p-6 mb-6">
            <div class="flex flex-col lg:flex-row lg:justify-between gap-6">
                <div class="max-w-2xl">
                    <h1>Member Registration</h1>
                    <p class="text-muted mt-2">Register new members to access exclusive pricing</p>
                </div>
                <div class="ghost-panel p-5 bg-surface">
                    <div class="flex items-center gap-3 mb-4">
                        <div>
                            <div class="candle-flame"></div>
                            <div class="candle-base"></div>
                        </div>
                        <div>
                            <p class="text-xs uppercase tracking-wide text-muted">Member Tracker</p>
                            <p class="text-sm font-semibold">Track member registrations</p>
                        </div>
                    </div>
                    <div class="candle-progress">
                        <div class="progress-track"><div class="progress-fill"></div></div>
                        <div class="text-right">
                            <span class="block text-xs uppercase text-muted">Progress</span>
                            <strong class="text-sm">74%</strong>
                        </div>
                    </div>
                    <p class="text-xs text-muted mt-4">Loyal members drive recurring revenue</p>
                </div>
            </div>
        </div>

        <div class="ghost-panel p-6">
            <form id="memberForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Member Name</label>
                    <input type="text" id="inputNama" class="uppercase" placeholder="e.g. John Doe" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Phone Number (Cashier ID)</label>
                    <input type="text" id="inputTelepon" placeholder="e.g. 0812345678" required>
                </div>
                <button type="submit" class="spectre-btn spectre-cta--primary w-full">Register Member</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kbaltquoajrmpixgsiec.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1LQ1lYO5I1MXJ0itz_PjBA_bvOLm9qP';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('memberForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('inputNama').value;
            const telepon = document.getElementById('inputTelepon').value;

            const { error } = await supabaseClient.from('members').insert([{ nama, telepon }]);

            if (error) {
                alert('Gagal registrasi: ' + error.message);
            } else {
                alert('🎉 MEMBER BERHASIL DIKUNCI KE DATABASE!');
                document.getElementById('memberForm').reset();
            }
        });
    </script>
</body>
</html>
