<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE - Premium Inventory Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
        .glass { background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-6 md:p-12">

    <div class="max-w-6xl mx-auto space-y-8">
        <div class="glass p-6 md:p-8 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r bg-clip-text text-transparent from-cyan-400 to-indigo-400">SPECTRE Inventory</h1>
                <p class="text-slate-400 text-sm mt-1">Sistem Manajemen Stok & Kasir Penjualan Real-time.</p>
            </div>
            <div class="flex flex-wrap gap-3">
                <a href="penjualan.html" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm px-5 py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition-all">
                    🛒 Kasir POS (Jual)
                </a>
                <a href="barang.html" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-5 py-3 rounded-xl shadow-lg shadow-blue-500/20 transition-all">
                    + Tambah Produk
                </a>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl">
                <p class="text-slate-400 text-sm font-medium">Total Varian Produk</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="totalItems" class="text-4xl font-bold text-cyan-400">0</span>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-slate-400 text-sm font-medium">Total Stok Inventaris</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="totalStock" class="text-4xl font-bold text-emerald-400">0</span>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-slate-400 text-sm font-medium">Valuasi Aset (Modal)</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="totalAsset" class="text-3xl font-bold text-amber-400">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="glass rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold text-slate-200 mb-4">Daftar Stok Produk</h2>
            <div class="overflow-x-auto rounded-xl border border-slate-700/50">
                <div id="productContainer">
                    <div class="p-8 text-center text-slate-400">Memuat data inventaris...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
