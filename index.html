<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPECTRE // Core Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070f; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .cyber-panel { 
            background: linear-gradient(135deg, rgba(13, 17, 33, 0.7) 0%, rgba(8, 10, 21, 0.9) 100%);
            border: 1px solid rgba(56, 189, 248, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .neon-glow-cyan { box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-10 selection:bg-cyan-500 selection:text-black">

    <div class="max-w-7xl mx-auto space-y-6 md:space-y-8">
        
        <div class="cyber-panel p-5 md:p-6 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-l-4 border-l-cyan-500">
            <div>
                <div class="flex items-center gap-2">
                    <span class="h-2 w-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#22d3ee]"></span>
                    <h1 class="text-xl md:text-2xl font-extrabold tracking-wider text-white mono uppercase">SPECTRE // PANEL</h1>
                </div>
                <p class="text-slate-500 text-[10px] uppercase tracking-widest mono mt-0.5">System: Active // Mobile Responsive Link Verified</p>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <a href="penjualan.html" class="flex-1 md:flex-none text-center bg-transparent hover:bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-bold text-[11px] uppercase tracking-widest px-4 py-3 rounded-lg transition-all duration-300">
                    🛒 Kasir POS
                </a>
                <a href="barang.html" class="flex-1 md:flex-none text-center bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-[11px] uppercase tracking-widest px-4 py-3 rounded-lg transition-all duration-300 neon-glow-cyan">
                    + Input Barang
                </a>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6">
            <div class="cyber-panel p-5 rounded-xl bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-cyan-950/20 via-transparent to-transparent">
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mono">// VARIASI_PRODUK</p>
                <div class="mt-2 flex justify-between items-end">
                    <span id="totalItems" class="text-3xl md:text-4xl font-black text-white mono">0</span>
                    <span class="text-[10px] text-cyan-400 font-medium mono">Jenis SKU</span>
                </div>
            </div>
            <div class="cyber-panel p-5 rounded-xl bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-emerald-950/20 via-transparent to-transparent">
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mono">// STOK_GUDANG</p>
                <div class="mt-2 flex justify-between items-end">
                    <span id="totalStock" class="text-3xl md:text-4xl font-black text-white mono">0</span>
                    <span class="text-[10px] text-emerald-400 font-medium mono">Total Unit</span>
                </div>
            </div>
            <div class="cyber-panel p-5 rounded-xl bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-amber-950/20 via-transparent to-transparent">
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mono">// VALUASI_ASET</p>
                <div class="mt-2">
                    <span id="totalAsset" class="text-2xl md:text-3xl font-black text-white mono">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="cyber-panel rounded-xl p-4 md:p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h2 class="text-xs font-bold uppercase tracking-widest text-slate-300 mono">// DATABANK_INVENTORY</h2>
                <span class="text-[10px] text-slate-600 font-bold mono hidden sm:inline">SWIPE_TO_SCROLL →</span>
            </div>
            <div class="overflow-x-auto rounded-lg border border-slate-900 bg-slate-950/40">
                <div id="productContainer">
                    <div class="p-12 text-center text-slate-500 mono text-xs uppercase animate-pulse">
                        >> Sinkronisasi data server...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
