<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE - Dashboard Inventory</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts untuk font modern -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CDN Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px;">

    <div style="max-width: 1200px; margin: 0 auto;">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; background: rgba(30, 41, 59, 0.5); padding: 24px; border-radius: 16px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.05);">
            <div>
                <h1 style="margin: 0; font-size: 28px; font-weight: 700; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SPECTRE Dashboard</h1>
                <p style="margin: 4px 0 0 0; color: #94a3b8; font-size: 14px;">Sistem Manajemen Inventaris Produk</p>
            </div>
            <a href="barang.html" style="background: #3b82f6; color: white; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: 0.3s; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);">
                + Kelola & Tambah Barang
            </a>
        </div>

        <!-- Summary Cards -->
        <div class="summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <div style="background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
                <span style="color: #94a3b8; font-size: 14px; display: block; margin-bottom: 8px;">Total Jenis Produk</span>
                <b id="totalItems" style="font-size: 32px; color: #38bdf8;">0</b>
            </div>
            <div style="background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
                <span style="color: #94a3b8; font-size: 14px; display: block; margin-bottom: 8px;">Total Stok Keseluruhan</span>
                <b id="totalStock" style="font-size: 32px; color: #10b981;">0</b>
            </div>
            <div style="background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
                <span style="color: #94a3b8; font-size: 14px; display: block; margin-bottom: 8px;">Estimasi Aset (Modal)</span>
                <b id="totalAsset" style="font-size: 24px; color: #f59e0b;">Rp 0</b>
            </div>
        </div>

        <!-- Main Content (Tabel) -->
        <div style="background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);">
            <h2 style="margin-top: 0; font-size: 18px; margin-bottom: 20px; color: #e2e8f0;">Daftar Stok Produk</h2>
            <div id="productContainer" style="overflow-x: auto;">
                <!-- Tabel akan di-render di sini oleh JavaScript -->
                <p style="color: #94a3b8;">Memuat data dari database...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
