<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE - Premium Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .fade-in { animation: fadeInUp 0.6s ease forwards; opacity: 0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen p-6 md:p-12">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <div class="glass p-6 md:p-8 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 fade-in">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-right bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-400">SPECTRE Inventory</h1>
                <p class="text-slate-400 text-sm mt-1">Sistem manajemen dan pelacakan stok real-time.</p>
            </div>
            <a href="barang.html" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-5 py-3 rounded-xl shadow-lg shadow-blue-500/20 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0">
                + Kelola & Tambah Barang
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl fade-in" style="animation-delay: 0.1s;">
                <p class="text-slate-400 text-sm font-medium">Total Varian Produk</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="totalItems" class="text-4xl font-bold text-cyan-400">0</span>
                    <span class="text-xs text-slate-500">item unik</span>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl fade-in" style="animation-delay: 0.2s;">
                <p class="text-slate-400 text-sm font-medium">Total Stok Inventaris</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="totalStock" class="text-4xl font-bold text-emerald-400">0</span>
                    <span class="text-xs text-slate-500">pcs tersedia</span>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl fade-in" style="animation-delay: 0.3s;">
                <p class="text-slate-400 text-sm font-medium">Valuasi Aset (Modal)</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <span id="totalAsset" class="text-3xl font-bold text-amber-400">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="glass rounded-2xl p-6 shadow-xl fade-in" style="animation-delay: 0.4s;">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-semibold text-slate-200">Daftar Stok Produk</h2>
                <span class="flex h-3 w-3 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
            </div>
            
            <div class="overflow-x-auto rounded-xl border border-slate-700/50">
                <div id="productContainer">
                    <div class="p-8 text-center text-slate-400 animate-pulse">Menghubungkan ke secure database...</div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
