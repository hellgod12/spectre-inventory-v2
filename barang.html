<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPECTRE // Inject Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Share Tech Mono', monospace; 
            background-color: #020205;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
        }
        .scary-logo {
            font-family: 'Creepster', cursive;
            text-shadow: 0 0 10px #ef4444;
        }
        .ghost-panel { 
            background: rgba(6, 6, 10, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .neon-glow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="text-rose-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md my-4">
        <a href="index.html" class="inline-flex items-center text-xs text-red-600 hover:text-red-400 transition-colors uppercase font-bold tracking-widest mb-4">
            << BACK_TO_CORE
        </a>

        <div class="ghost-panel p-6 rounded-none shadow-2xl border-t-4 border-t-red-600">
            <h2 class="text-3xl text-red-500 scary-logo mb-1 tracking-wider">INJECT_STOCK</h2>
            <p class="text-slate-500 text-[9px] uppercase tracking-widest mb-6">Database injection protocol for apparel & skate hardware</p>

            <form id="productForm" class="space-y-4 text-xs">
                <div>
                    <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// ITEM_IDENTIFIER</label>
                    <input type="text" id="nama_barang" class="w-full bg-stone-950 border border-red-950 rounded-none px-3 py-3 text-white focus:outline-none focus:border-red-600 uppercase tracking-wide" placeholder="E.G. SPECTRE SLICK DECK" required>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// SECTOR_CATEGORY</label>
                    <select id="kategori" class="w-full bg-stone-950 border border-red-950 rounded-none px-3 py-3 text-slate-300 focus:outline-none focus:border-red-600" required>
                        <option value="Apparel">👕 APPAREL (CLOTHING, HOODIES)</option>
                        <option value="Skateboard">🛹 SKATEBOARD (DECKS, TRUCKS, FULLSET)</option>
                        <option value="Perlengkapan">🛠️ HARDWARE (BEARINGS, GRIPTAPES)</option>
                    </select>
                </div>

                <div id="sizeContainer" class="hidden">
                    <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// SIZE_VARIANT</label>
                    <select id="ukuran" class="w-full bg-stone-950 border border-red-950 rounded-none px-3 py-3 text-slate-300 focus:outline-none focus:border-red-600">
                        <option value="">-- PILIH UKURAN --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// QUANTITY_LOAD</label>
                    <input type="number" id="stok" class="w-full bg-stone-950 border border-red-950 rounded-none px-3 py-3 text-white focus:outline-none focus:border-red-600 font-bold" placeholder="0" required>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">BASE_COST</label>
                        <input type="number" id="harga_modal" class="w-full bg-stone-950 border border-red-950 rounded-none px-2 py-3 text-white focus:outline-none focus:border-red-600 font-bold" placeholder="Rp" required>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">PUBLIC</label>
                        <input type="number" id="harga_jual" class="w-full bg-stone-950 border border-red-950 rounded-none px-2 py-3 text-red-400 focus:outline-none focus:border-red-600 font-bold" placeholder="Rp" required>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">SOUL_MEMBER</label>
                        <input type="number" id="harga_member" class="w-full bg-stone-950 border border-red-950 rounded-none px-2 py-3 text-rose-400 focus:outline-none focus:border-red-600 font-bold" placeholder="Rp" required>
                    </div>
                </div>

                <button type="submit" id="btnSimpan" class="w-full bg-red-700 hover:bg-red-600 text-white font-black text-xs uppercase tracking-widest py-3.5 rounded-none transition-all duration-300 mt-2 neon-glow-red">
                    EXECUTE_INJECTION
                </button>
            </form>
        </div>
    </div>

    <script>
        const sizeApparel = ['XS','S','M','L','XL','XXL','XXXL'];
        const sizeSkateboard = ['7.5"','7.75"','8.0"','8.25"','8.5"','8.75"','9.0"'];

        const kategoriEl = document.getElementById('kategori');
        const sizeContainer = document.getElementById('sizeContainer');
        const ukuranEl = document.getElementById('ukuran');

        function updateSizeOptions() {
            const val = kategoriEl.value;
            sizeContainer.classList.add('hidden');
            ukuranEl.innerHTML = '<option value="">-- PILIH UKURAN --</option>';
            ukuranEl.required = false;

            if (val === 'Apparel') {
                sizeApparel.forEach(s => ukuranEl.innerHTML += `<option value="${s}">${s}</option>`);
                sizeContainer.classList.remove('hidden');
                ukuranEl.required = true;
            } else if (val === 'Skateboard') {
                sizeSkateboard.forEach(s => ukuranEl.innerHTML += `<option value="${s}">${s}</option>`);
                sizeContainer.classList.remove('hidden');
                ukuranEl.required = true;
            }
        }

        kategoriEl.addEventListener('change', updateSizeOptions);
        updateSizeOptions();
    </script>
    <script src="barang.js"></script>
</body>
</html>
