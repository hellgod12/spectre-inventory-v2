<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE - Tambah Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div id="toast" class="fixed top-5 right-5 glass border-emerald-500/30 bg-emerald-950/80 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 transform translate-x-[150%] transition-transform duration-500 z-50">
        <span class="text-emerald-400 text-lg">🎉</span>
        <p id="toastMessage" class="text-sm font-medium text-slate-200"></p>
    </div>

    <div class="w-full max-w-lg my-8">
        <a href="index.html" class="inline-flex items-center text-sm text-slate-400 hover:text-white transition-colors mb-6 group">
            <span class="mr-2 transform group-hover:-translate-x-1 transition-transform">←</span> Kembali ke Dashboard
        </a>

        <div class="glass p-8 rounded-2xl shadow-2xl">
            <h2 class="text-2xl font-bold text-slate-100 mb-1">Tambah Produk Baru</h2>
            <p class="text-slate-400 text-xs mb-8">Formulir integrasi terenkripsi ke database awan Supabase.</p>

            <form id="productForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nama Produk / Barang</label>
                    <input type="text" id="nama_barang" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all" placeholder="Misal: Kemeja Flanel Hitam" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Jumlah Unit Stok</label>
                    <input type="number" id="stok" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all" placeholder="0" required>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Harga Modal</label>
                        <input type="number" id="harga_modal" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all" placeholder="Rp" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Harga Jual</label>
                        <input type="number" id="harga_jual" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all" placeholder="Rp" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Harga Member</label>
                        <input type="number" id="harga_member" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all" placeholder="Rp" required>
                    </div>
                </div>

                <button type="submit" id="btnSimpan" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-sm text-white py-4 rounded-xl shadow-lg shadow-emerald-600/10 transition-all duration-300 mt-4 flex justify-center items-center gap-2">
                    Simpan ke Supabase
                </button>
            </form>
        </div>
    </div>

    <script src="barang.js"></script>
</body>
</html>
