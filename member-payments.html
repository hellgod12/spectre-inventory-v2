<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SPECTRE // Member Payments</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f1f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SPECTRE">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="member-payments.js"></script>
    <style>
        /* iPhone Safe Area Support */
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }
        
        .member-payment-card {
            background: var(--surface);
            border: 1px solid var(--stroke);
            padding: 20px;
            border-radius: var(--radius-lg);
            transition: all .2s ease;
        }
        .member-payment-card:hover {
            border-color: var(--stroke-accent);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pending {
            background: rgba(234, 179, 8, 0.2);
            color: rgb(234, 179, 8);
            border: 1px solid rgba(234, 179, 8, 0.3);
        }
        .status-partial {
            background: rgba(59, 130, 246, 0.2);
            color: rgb(59, 130, 246);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .status-paid {
            background: rgba(34, 197, 94, 0.2);
            color: rgb(34, 197, 94);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-cancelled {
            background: rgba(239, 68, 68, 0.2);
            color: rgb(239, 68, 68);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        /* Mobile typography improvements */
        @media (max-width: 600px) {
            .text-4xl {
                font-size: 2rem;
                line-height: 1.2;
            }
            .text-lg {
                font-size: 1.125rem;
                line-height: 1.5;
            }
            
            /* Mobile spacing improvements */
            .ghost-panel {
                padding: 16px;
            }
            .member-payment-card {
                padding: 16px;
            }
        }
    </style>
</head>
<body class="spectre-body">
    <div class="spectre-content">
        <a href="index.html" class="spectre-btn mb-4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Dashboard</a>

        <div class="ghost-panel p-6 mb-6">
            <div class="flex flex-col lg:flex-row lg:justify-between gap-6">
                <div>
                    <h1 class="text-4xl font-bold tracking-tight mb-2" style="background: var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter: drop-shadow(0 0 30px rgba(124,92,255,0.3)); letter-spacing: -0.02em;">Member Payments</h1>
                    <p class="text-muted text-lg mt-1">Manage member payments and outstanding balances</p>
                </div>
            </div>
        </div>

        <div class="ghost-panel p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Outstanding Balances</h2>
                <div id="totalOutstanding" class="text-xl font-semibold text-red-400">Rp 0</div>
            </div>
            <div id="memberDebtList" class="space-y-3">
                <div class="p-8 text-center text-muted text-xs">Loading member debt...</div>
            </div>
        </div>

        <div class="ghost-panel p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Payment History</h2>
                <select id="filterStatus" class="px-3 py-2 bg-black/50 border border-stone-800 rounded text-sm">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="partial">Partial</option>
                    <option value="paid">Paid</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div id="paymentHistory" class="space-y-3">
                <div class="p-8 text-center text-muted text-xs">Loading payment history...</div>
            </div>
        </div>
    </div>

    <script>
        // Service Worker Registration + iOS update flow
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    console.log('[PWA] registering service-worker.js');
                    const registration = await navigator.serviceWorker.register('./service-worker.js');
                    console.log('[PWA] SW registered. scope=', registration.scope);

                    if (registration.waiting) {
                        console.log('[PWA] found waiting SW -> skipWaiting');
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }

                    registration.addEventListener?.('updatefound', () => {
                        console.log('[PWA] updatefound');
                        const installing = registration.installing;
                        if (!installing) return;
                        installing.addEventListener('statechange', () => {
                            console.log('[PWA] installing state:', installing.state);
                            if (installing.state === 'installed') {
                                console.log('[PWA] new SW installed -> skipWaiting');
                                installing.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });

                    navigator.serviceWorker.addEventListener('message', (event) => {
                        const msg = event.data || {};
                        if (msg.type === 'SW_VERSION') {
                            console.log('[PWA] SW_VERSION message:', msg);
                            location.reload();
                        }
                    });
                } catch (error) {
                    console.error('[PWA] Service Worker registration failed:', error);
                }
            });
        }
    </script>

    
    <!-- Mobile Bottom Navigation -->
    <nav class="spectre-bottomnav" aria-label="Mobile navigation">
        <a href="index.html" class="spectre-bottomnav__item">Dashboard</a>
        <a href="member.html" class="spectre-bottomnav__item is-active">Members</a>
        <a href="penjualan.html" class="spectre-bottomnav__item">Sales</a>
        <a href="barang.html" class="spectre-bottomnav__item">Products</a>
    </nav>
</body>
</html>
