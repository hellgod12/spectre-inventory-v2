<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRE - Kasir POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
        .glass { background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-6 md:p-12">

    <div class="max-w-4xl mx-auto space-y-8">
        <a href="index.html" class="inline-flex items-center text-sm text-slate-400 hover:text-white transition-colors">
            ← Kembali ke Dashboard
        </a>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-2xl shadow-2xl">
                <h2 class="text-2xl font-bold mb-6">Kasir Penjualan</h2>
                <form id="salesForm" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Pilih Produk</label>
                        <select id="selectProduct" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500" required>
                            <option value="">-- Memuat Produk --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Tipe Pembeli</label>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-2 bg-slate-800/50 border border-slate-700 px-4 py-3 rounded-xl flex-1 cursor-pointer">
                                <input type="radio" name="tipe_pembeli" value="Umum" checked id="typeUmum"> Umum
                            </label>
                            <label class="flex items-center gap-2 bg-slate-800/50 border border-slate-700 px-4 py-3 rounded-xl flex-1 cursor-pointer">
                                <input type="radio" name="tipe_pembeli" value="Member" id="typeMember"> Member
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Jumlah Beli</label>
                        <input type="number" id="inputJumlah" min="1" value="1" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500" required>
                    </div>

                    <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50 space-y-2">
                        <div class="flex justify-between text-sm text-slate-400">
                            <span>Harga Satuan:</span>
                            <span id="previewHargaSatuan">Rp 0</span>
                        </div>
                        <div class="flex justify-between text-base font-bold text-slate-200">
                            <span>Total Bayar:</span>
                            <span id="previewTotal" class="text-cyan-400">Rp 0</span>
                        </div>
                    </div>

                    <button type="submit" id="btnProses" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-4 rounded-xl shadow-lg transition-all">
                        Proses Transaksi & Potong Stok
                    </button>
                </form>
            </div>

            <div class="glass p-8 rounded-2xl shadow-2xl flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-semibold mb-4 text-slate-300">Live Monitor Gudang</h3>
                    <div id="productDetail" class="space-y-3 text-sm text-slate-400">
                        <p>Silakan pilih produk untuk memantau sisa kapasitas stok gudang.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="penjualan.js"></script>
</body>
</html>
