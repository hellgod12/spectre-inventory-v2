<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPECTRE // Terminal Kasir Rahasia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Share Tech Mono', monospace; 
            background-color: #020205;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
        }
        .scary-logo { font-family: 'Creepster', cursive; text-shadow: 0 0 10px #ef4444; }
        .ghost-panel { background: rgba(6, 6, 10, 0.9); border: 1px solid rgba(239, 68, 68, 0.2); }
        .neon-glow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
    </style>
    <link rel="stylesheet" href="status.css">
</head>
<body class="text-rose-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-4">
        <a href="index.html" class="inline-flex items-center text-xs text-red-600 hover:text-red-400 transition-colors uppercase font-bold tracking-widest mb-2">
            << KEMBALI_KE_DASHBOARD
        </a>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
            <div class="ghost-panel p-6 rounded-none shadow-2xl md:col-span-2 border-t-4 border-t-red-600">
                <h2 class="text-3xl text-red-500 scary-logo mb-1 tracking-wider">TERMINAL_KASIR</h2>
                <p class="text-slate-500 text-[9px] uppercase tracking-widest mb-6">// PROTOKOL_MUTASI_KELUAR_BARANG</p>
                
                <form id="salesForm" class="space-y-4 text-xs">
                    <div>
                        <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// PILIH_PRODUK_TARGET</label>
                        <select id="selectProduct" class="w-full bg-stone-950 border border-red-950 rounded-none px-3 py-3 text-slate-100 font-medium focus:outline-none focus:border-red-600 uppercase" required>
                            <option value="">-- MENGAMBIL DATA SERVER... --</option>
                        </select>
                    </div>

                    <div id="boxUkuranSelect" class="hidden">
                        <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// SIZE_VARIANT</label>
                        <select id="selectUkuran" class="w-full bg-stone-950 border border-red-950 rounded-none px-3 py-3 text-yellow-400 font-bold focus:outline-none focus:border-red-600 uppercase">
                            <option value="">-- PILIH UKURAN --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// KATEGORI_TARIF_DANA</label>
                        <div class="flex gap-2">
                            <label class="flex items-center gap-2 bg-stone-950 border border-red-950 px-3 py-3 rounded-none flex-1 cursor-pointer text-[11px] text-slate-400 font-bold">
                                <input type="radio" name="tipe_pembeli" value="Umum" checked id="typeUmum" class="accent-red-600"> PELANGGAN_UMUM
                            </label>
                            <label class="flex items-center gap-2 bg-stone-950 border border-red-950 px-3 py-3 rounded-none flex-1 cursor-pointer text-[11px] text-rose-400 font-bold">
                                <input type="radio" name="tipe_pembeli" value="Member" id="typeMember" class="accent-rose-600"> MEMBER_TERDAFTAR
                            </label>
                        </div>
                    </div>

                    <div id="boxMemberSelect" class="hidden animate-fade-in">
                        <label class="block text-[10px] font-bold text-purple-400 uppercase tracking-widest mb-1.5">// KUNCI_NOMOR_TELEPON_MEMBER</label>
                        <select id="selectMember" class="w-full bg-stone-950 border border-purple-950 rounded-none px-3 py-3 text-purple-300 font-bold focus:outline-none focus:border-purple-600">
                            <option value="">-- PILIH NO TELEPON MEMBER --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// JUMLAH_BARANG_KELUAR</label>
                        <input type="number" id="inputJumlah" min="1" value="1" class="w-full bg-stone-950 border border-red-950 rounded-none px-3 py-3 text-white focus:outline-none focus:border-red-600 font-bold text-sm" required>
                    </div>
                    
                    <div class="bg-stone-950 p-4 border border-red-950/60 space-y-1.5">
                        <div class="flex justify-between text-[10px] text-slate-500 uppercase">
                            <span>NILAI_SATUAN:</span>
                            <span id="previewHargaSatuan" class="text-slate-300 font-bold">Rp 0</span>
                        </div>
                        <div class="flex justify-between text-xs font-bold uppercase pt-1.5 border-t border-red-950">
                            <span class="text-red-500/80">TOTAL_TAGIHAN_DANA:</span>
                            <span id="previewTotal" class="text-red-500 text-base font-black tracking-wider">Rp 0</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-red-500/70 uppercase tracking-widest mb-1.5">// METODE_PEMBAYARAN</label>
                        <div class="flex flex-wrap gap-2">
                            <label class="flex items-center gap-2 bg-stone-950 border border-red-950 px-3 py-3 rounded-none flex-1 cursor-pointer text-[11px] text-slate-400 font-bold">
                                <input type="radio" name="metode_pembayaran" value="Cash" checked id="payCash" class="accent-red-600"> TUNAI
                            </label>
                            <label class="flex items-center gap-2 bg-stone-950 border border-red-950 px-3 py-3 rounded-none flex-1 cursor-pointer text-[11px] text-rose-400 font-bold">
                                <input type="radio" name="metode_pembayaran" value="Transfer" id="payTransfer" class="accent-rose-600"> TRANSFER CASH
                            </label>
                            <label class="flex items-center gap-2 bg-stone-950 border border-red-950 px-3 py-3 rounded-none flex-1 cursor-pointer text-[11px] text-yellow-400 font-bold">
                                <input type="radio" name="metode_pembayaran" value="Belum" id="payBelum" class="accent-yellow-500"> BELUM BAYAR
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="btnProses" class="w-full bg-red-700 hover:bg-red-600 text-white font-black text-xs uppercase tracking-widest py-3.5 rounded-none transition-all duration-300 neon-glow-red">
                        EKSEKUSI_POTONG_STOK
                    </button>
                </form>
            </div>

            <div class="ghost-panel p-5 rounded-none flex flex-col justify-between bg-stone-950/40 border-l-2 border-l-red-900">
                <div class="space-y-3">
                    <h3 class="text-[10px] font-bold text-red-500 uppercase tracking-widest">// SPESIFIKASI_TARGET_BARANG</h3>
                    <div id="productDetail" class="space-y-3 text-xs text-slate-400">
                        <p class="text-red-900/60 text-[10px] uppercase animate-pulse">>> Menunggu input parameter data...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="penjualan.js"></script>
</body>
</html>
